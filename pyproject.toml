[project]
name = "knowledge-ingest"
version = "0.2.0"
description = "Multi-source knowledge ingestion orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "pydantic>=2.9,<3",
]

[project.scripts]
knowledge-ingest = "knowledge_ingest.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 默认规则集（E4/E7/E9 + F）。机械问题（未用 import、行长等）直接修；
# 语义可疑的条目单独注明后跳过，不做行为性改动。

[tool.coverage.run]
source = ["knowledge_ingest"]

[tool.coverage.report]
# 宽松起步（v0.3）：先让 CI 覆盖率可见，再逐步收紧
fail_under = 50
