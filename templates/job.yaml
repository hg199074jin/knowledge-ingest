# Job Manifest 模板（说明性样例；实际 manifest 由 ManifestStore 生成与维护）
schema_version: 2
job_id: "YYYYMMDD-HHMMSS-<provider>-<slug>-<6hex>"
created_at: "2026-09-06T00:00:00+08:00"
updated_at: "2026-09-06T00:00:00+08:00"
status: CREATED
request:
  raw_prompt: ""
  provider: local   # local | baidu | quark | telegram
  source: ""
  targets: []       # cangjie | personal | family_router（可多选）
source: {}
routing: {}
media: {}
docchunk: {}
# v0.3：target 状态进 targets dict（保持声明顺序）；
# depends_on 决定能不能运行，声明顺序决定先运行谁
targets:
  cangjie:
    status: PENDING
    depends_on: []
  personal:
    status: PENDING
    depends_on: []
  # family_router:
  #   status: PENDING
  #   depends_on: [cangjie]
active_target: null    # 当前 RUNNING/WAITING_USER 的 target；终态必须为 null
budget_state: {}       # 规格 9：{targets: {<name>: {calls, cases, hosts, permits}}}
preauthorizations: []  # 规格 10：gate 预授权 grant 列表
gate_history: []
errors: []
