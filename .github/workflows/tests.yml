name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: Coverage (ubuntu only)
        if: runner.os == 'Linux'
        run: >
          uv run pytest --cov=knowledge_ingest --cov-report=term
          --cov-fail-under=50
